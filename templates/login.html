{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión 🔒</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{% static 'images/fondo3.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.65);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="card bg-dark text-white p-4 shadow-lg" style="width: 350px; max-width: 100%; border-radius: 15px;">
            {% if bloqueado %}
                <h4 class="text-center mb-3">⏳ Acceso bloqueado</h4>
                <div class="alert alert-warning py-2 small">
                    Demasiados intentos fallidos. Vuelve a intentarlo en unos {{ minutos }} minuto{{ minutos|pluralize }}.
                </div>
            {% else %}
                <h4 class="text-center mb-3">🔒 Iniciar Sesión</h4>
                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <input type="password" name="clave" class="form-control mb-3" placeholder="Contraseña" required autofocus>
                    <button type="submit" class="btn btn-success w-100">Ingresar</button>
                </form>
            {% endif %}
            <a href="{% url 'lista_recetas' %}" class="btn btn-outline-light btn-sm mt-3">← Volver</a>
        </div>
    </div>
</body>
</html>
